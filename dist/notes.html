<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVS I Lectures &#183; Peer support 82 (Tutor)</title>
<meta name="description" content="Question-first peer-tutoring deck for the CVS I lectures (MDCU): anatomy, histology, physiology, biochemistry, ECG and imaging of the cardiovascular system.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: minmax(0, 1fr); } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.pts ul, .steps ul { margin: 4px 0 0; padding-left: 1.1em; display: grid; gap: 3px; }  /* sub-points */
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.eqn .cz { color: transparent; }  /* a blank inside an equation stays hidden until revealed */
.eqn .cz.on, .czopen .eqn .cz, .showall .eqn .cz { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.flow.col .fbox { flex: none; }  /* stacked flowchart: boxes keep their own height */
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
@media (max-width: 600px) { .scan figcaption .src, .chip { white-space: normal; } }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 6px; margin: 0; padding: 0 0 14px 1.2em; line-height: 1.65; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body li::marker { color: var(--ok); }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrs { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink .qrcap { font: 500 .78em var(--f-body); color: var(--ink2); }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink .qrcap, .qrlink img { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }

/* figure that would give away a card's blanks: collapsed behind a summary (closed in the PDF) */
.figans { border: 1px dashed var(--rule); border-radius: 10px; padding: 8px 12px; }
.figans summary { cursor: pointer; font: 500 .85em var(--f-mono); color: var(--ink2); }
.figans[open] summary { margin-bottom: 8px; }
/* short concept cards (data/lite.js): arrow chains and brief bullets */
.lt { display: grid; gap: 10px; align-content: start; }
.lt-two { align-items: start; }
.lt-figs { display: grid; gap: 12px; }
.lt-chain { margin: 0; padding: 8px 12px; background: var(--sheet2); border-radius: 8px; line-height: 1.65; font-weight: 500; }
.lt-ar { color: var(--art); font-weight: 700; padding: 0 .12em; }
.lt-pts { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; line-height: 1.5; }
.lt-h { margin: 4px 0 -4px; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.lt-trap { margin: 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 8px; padding: 6px 10px; font-size: .95em; }
.lt-p { margin: 0; }
.lt-tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
.lt-tbl th { text-align: left; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border-bottom: 1.5px solid var(--rule); padding: 4px 8px; }
.lt-tbl td { border-bottom: 1px solid var(--rule); padding: 5px 8px; vertical-align: top; }
.lt .eqn { font-size: 1.15em; padding: 2px 0; }

/* ---------- interactive flowcharts (src/flows.js): PFT on P-C4, acid-base on A-C5 ---------- */
.flowx { border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.fx-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.fx-head b { font: 600 1.08em var(--f-display); color: var(--ven); }
.fx-head span { color: var(--ink2); font-size: .88em; }
.fx-cases { display: flex; flex-wrap: wrap; gap: 6px; }
.fx-btn { font: 500 .86em var(--f-body); border: 1.5px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; line-height: 1.4; }
.fx-btn:hover { border-color: var(--ven); }
.fx-btn.on { background: var(--ven); border-color: var(--ven); color: var(--sheet); }
.fx-btn.go { background: var(--art); border-color: var(--art); color: var(--sheet); font-weight: 600; }
.fx-btn.ghost { border-style: dashed; }
.fx-btn.ghost.on { border-style: solid; }
.fx-btn:disabled { opacity: .4; cursor: default; }
.fx-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; align-items: end; background: var(--sheet2); border-radius: 10px; padding: 10px; }
.fx-form label { display: grid; gap: 2px; font-size: .8em; color: var(--ink2); }
.fx-form input { font: 500 1rem var(--f-mono); width: 100%; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); }
.fx-case { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .86em; }
.fx-src { font-family: var(--f-mono); color: var(--ink2); margin-right: 4px; }
.fx-chip { background: var(--sheet2); border-radius: 999px; padding: 2px 10px; }
.fx-chip b { font-family: var(--f-mono); font-weight: 600; }
.fx-scroll { overflow-x: auto; min-width: 0; }
.fx-svg { display: block; width: 100%; min-width: 640px; height: auto; }
.fx-node { cursor: pointer; transition: opacity .2s; }
.fx-node > rect { fill: var(--sheet); stroke: var(--rule); stroke-width: 1.5; transition: fill .2s, stroke .2s; }
.fx-node.k-q > rect { fill: var(--ven-soft); stroke: var(--ven); }
.fx-node.k-leaf > rect { fill: var(--sheet2); stroke: var(--ink2); }
.fx-node.k-st > rect { fill: var(--sheet2); stroke: var(--ink2); }
.fx-node.k-note > rect { fill: none; stroke: var(--ink2); stroke-dasharray: 5 4; }
.fx-node.k-cause > rect { fill: none; stroke: var(--rule); stroke-dasharray: 2 3; }
.fx-node:hover > rect { stroke: var(--art); }
.fx-node:focus { outline: none; }
.fx-node:focus-visible > rect { stroke: var(--ven); stroke-width: 3; }
.fx-t { font: 600 16px var(--f-display); fill: var(--ink); }
.fx-s { font: 12.5px var(--f-body); fill: var(--ink2); }
.fx-node.k-cause .fx-t { font-size: 14px; fill: var(--ink2); }
.fx-node.on > rect { fill: var(--art-soft); stroke: var(--art); stroke-width: 2.2; }
.fx-node.cur > rect { stroke-width: 3.6; }
.fx-node.sel > rect { stroke: var(--ok); stroke-width: 3; stroke-dasharray: none; }
.fx-node.dim, .fx-edge.dim { opacity: .38; }
.fx-edge path { fill: none; stroke: var(--ink2); stroke-width: 1.6; }
.fx-edge.dash path { stroke-dasharray: 5 4; }

/* Shared registry for both pages (deck + tutor notes) and print.js.
   Concept-card HTML may mark key details as {{blanks}}: they render as click-to-reveal cloze spans.
   CVS.fig(name, caption, pdf, page[, cls]) builds a click-to-zoom course figure from img/<name>.jpg
   (sizes from data/figs.js). */
window.CVS = {
  sections: [],
  dims: {},
  SRC: {
    anat: 'Pericardium, heart &amp; great vessels handout',
    histo: 'Histology of CVS handout',
    histosheet: 'Histology of CVS lab sheet',
    elec: 'Electrical &amp; cardiac cycle handout',
    cd1: 'Circulatory dynamics 1 handout',
    cd2: 'Circulatory dynamics 2 handout',
    micro: 'Microcirculation handout',
    reg: 'Regulation in CVS handout',
    bio: 'Biochemistry of CVS handout',
    bioth: 'Biochemistry of the heart handout (Thai)',
    ecg: 'Basic ECG handout',
    regional: 'Regional circulation handout',
    imaging: 'Imaging of CVS handout',
    exercise: 'CVS changes in exercise handout',
    pevasc: 'Physical examination of vascular system handout',
    ac81: 'AC81 CVS I MCQ recall (PS81)',
    ac81s: 'AC81 spot test',
    ac80: 'AC80 CVS I MCQ recall',
    ac80s: 'AC80 spot test',
    ac79s: 'AC79 spot test',
    ac7579: 'AC75–79 CVS compilation (PS79)'
  },
  cloze: function (h) { return String(h).replace(/\{\{([\s\S]*?)\}\}/g, '<span class="cz">$1</span>'); },
  fig: function (name, cap, pdf, page, cls) {
    var d = this.dims[name];
    if (!d) throw new Error('no image ' + name);
    var alt = String(cap).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
    return '<figure class="scan' + (cls ? ' ' + cls : '') + '"><div class="paperimg"><img src="img/' + name + '.jpg" width="' + d[0] + '" height="' + d[1] + '" alt="' + alt + '" loading="lazy" decoding="async"></div><figcaption>' + cap + ' <span class="src">' + (this.SRC[pdf] || pdf) + ', p.' + page + '</span></figcaption></figure>';
  },
  ans: function (fig, label) { return '<details class="figans"><summary>' + (label || 'The slide (shows the answers)') + '</summary>' + fig + '</details>'; },
  /* Options are written with the answer first; shuffle them once, the same way everywhere (seeded by the item ID).
     Options such as "None ..." or "All ..." stay last. Set keep: true to leave an item's order alone. */
  shuffle: function (it) {
    if (it.t !== 'q' || it.keep) return;
    var h = 2166136261, i;
    for (i = 0; i < it.id.length; i++) { h ^= it.id.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var rnd = function () { h = (h + 0x6D2B79F5) >>> 0; var t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    var idx = it.o.map(function (o, k) { return k; });
    var free = idx.filter(function (k) { return !/^(None|All |Both |Neither )/.test(it.o[k]); });
    var tail = idx.filter(function (k) { return free.indexOf(k) < 0; });
    for (i = free.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = free[i]; free[i] = free[j]; free[j] = t; }
    var order = free.concat(tail), A = [].concat(it.a);
    it.o = order.map(function (k) { return it.o[k]; });
    var na = A.map(function (a) { return order.indexOf(a); });
    it.a = Array.isArray(it.a) ? na : na[0];
  },
  add: function (sec) {
    sec.items.forEach(function (it) { if (it.html) it.html = window.CVS.cloze(it.html); window.CVS.shuffle(it); });
    this.sections.push(sec);
  }
};

/* Section A: Pericardium, Heart & Great Vessels (116-69 handout 01, 68 pp.). Card text lives in data/lite.js. */
CVS.add({ id: 'A', short: 'Heart & vessels', title: 'Pericardium, Heart & Great Vessels', kind: 'Lecture',
  blurb: 'Pericardium and its sinuses, borders and surface anatomy, the four chambers, coronary arteries and veins, conduction and nerves, the great vessels, and fetal circulation with its remnants.',
  items: [
  { t: 'c', id: 'A-C1', title: 'Pericardium: two sacs, one cavity, two sinuses', src: 'Anatomy p.3–9',
    html: CVS.fig('anat-pericardium', 'Fibrous and serous pericardium wrapping the heart; the pericardial cavity lies between the serous layers.', 'anat', 4) +
      CVS.fig('anat-sinuses', 'Pericardial sac opened: the transverse and oblique pericardial sinuses (boxed in red).', 'anat', 8) },
  { t: 'q', id: 'A1', src: 'AC76', core: true,
    q: 'ชั้นนอกสุดของ epicardium คือ <span class="muted">(What forms the outermost layer of the epicardium?)</span>',
    o: ['Mesothelium', 'Smooth muscle cells', 'Endothelium'], a: 0,
    ex: 'The epicardium is the visceral layer of serous pericardium. Its free surface is a simple squamous mesothelium that faces the pericardial cavity. Endothelium lines the chambers and vessels instead.',
    flag: 'Only three options were recalled.' },
  { t: 'tf', id: 'A2', src: 'Anatomy p.7–8', core: false,
    q: 'The transverse pericardial sinus lies behind the pulmonary trunk and ascending aorta, while the oblique sinus is bounded by the pulmonary veins and the inferior vena cava.', a: true,
    ex: 'True. Both sinuses come from the uneven line of reflection of the serous pericardium. A finger in the transverse sinus passes behind the two arterial trunks; the oblique sinus is a blind recess behind the left atrium framed by the pulmonary veins and IVC.' },

  { t: 'c', id: 'A-C2', title: 'Where the heart sits: borders, surfaces and the auscultation points', src: 'Anatomy p.10–12, 39–40',
    html: CVS.fig('anat-borders', 'Borders of the heart in situ: right border, left border, inferior border and apex.', 'anat', 11) +
      CVS.fig('anat-auscult', 'Valve auscultation areas on the chest wall.', 'anat', 40) },
  { t: 'q', id: 'A3', src: 'AC79', core: true,
    q: 'In a healthy adult, what is the typical anatomical position of the apex of the heart?',
    o: ['Left 5th intercostal space, midclavicular line', 'Right 4th intercostal space, midclavicular line', 'Left 5th intercostal space, anterior axillary line', 'Sternal angle, midline', 'Right 2nd intercostal space, parasternal line'], a: 0,
    ex: 'The apex is the tip of the left ventricle, in the left 5th intercostal space about 8 cm from the sternal border (midclavicular line). This is also where the mitral area is heard.' },
  { t: 'q', id: 'A4', src: 'AC80', core: true,
    q: 'A patient with a history of atrial fibrillation presents with dysphagia. Which structure compresses the esophagus?',
    o: ['LA', 'LV', 'Pulmonary trunk', 'RA', 'RV'], a: 0,
    ex: 'The left atrium is the most posterior chamber and lies directly in front of the esophagus. In atrial fibrillation blood stagnates and the LA dilates, so it can press on the esophagus and cause dysphagia.' },

  { t: 'c', id: 'A-C3', title: 'Right atrium and right ventricle: the landmarks inside', src: 'Anatomy p.17–18, 21–23',
    html: CVS.fig('anat-ra', 'Interior of the right atrium: the smooth part (*) and the ridged wall of the atrium proper.', 'anat', 21) +
      CVS.fig('anat-koch', 'Triangle of Koch on the septal wall of the right atrium.', 'anat', 22) +
      CVS.fig('anat-moderator', 'Opened right ventricle: the septomarginal trabecula reaching the anterior papillary muscle.', 'anat', 23) },
  { t: 'q', id: 'A5', src: 'AC79 · AC81', core: true,
    q: 'What is located in the triangle of Koch?',
    o: ['AV node', 'SA node', 'His bundle', 'Fossa ovalis', 'Purkinje fiber'], a: 0,
    ex: 'The triangle of Koch lies on the septal wall of the right atrium, bounded by the tendon of Todaro, the base of the septal tricuspid leaflet and the coronary sinus opening. The AV node sits at its apex, so it is the landmark used to avoid the node during ablation.' },
  { t: 'q', id: 'A6', src: 'AC77 · AC81', core: true,
    q: 'Which structure is found at the ventricle of the heart?',
    o: ['Trabeculae carnae', 'Auricle', 'Crista terminalis', 'Fossa ovalis', 'Sinus venarium'], a: 0,
    ex: 'Trabeculae carneae are the muscular ridges of both ventricles. The auricle, crista terminalis, fossa ovalis and sinus venarum are all atrial structures.',
    flag: 'The paper spells them “trabeculae carnae” and “sinus venarium”; the correct terms are trabeculae carneae and sinus venarum. AC77 asked the same idea (“which structure lies in the right ventricle?”).' },
  { t: 'q', id: 'A7', src: 'AC76',
    q: 'Which is not found in right atrium?',
    o: ['Moderator band', 'Superior vena cava opening', 'Coronary sinus', 'Fossa ovalis'], a: 0,
    ex: 'The moderator band (septomarginal trabecula) crosses the right ventricle from the septum to the anterior papillary muscle. The SVC and coronary sinus open into the right atrium, and the fossa ovalis is on its septal wall.' },
  { t: 'q', id: 'A8', src: 'AC81 spot', core: true, keep: true,
    q: 'Station 2. Identify structure A.',
    fig: CVS.fig('ac81s-st2', 'AC81 spot station 2: opened right ventricle.', 'ac81s', 3),
    o: ['Anterior papillary muscle', 'Posterior papillary muscle', 'Septal papillary muscle', 'Moderator band'], a: 3,
    ex: 'A crosses the cavity from the interventricular septum to the base of the anterior papillary muscle: the moderator band. It carries the right bundle branch, so the anterior papillary muscle contracts in time to tense its chordae. Only the right ventricle has one.' },
  { t: 'q', id: 'A9', src: 'AC81 spot', keep: true,
    q: 'Station 2. Identify structure B.',
    fig: CVS.fig('ac81s-st2', 'AC81 spot station 2: opened right ventricle.', 'ac81s', 3), figRef: 'A8',
    o: ['Anterior cusp of tricuspid valve', 'Posterior cusp of tricuspid valve', 'Septal cusp of tricuspid valve', 'None of above'], a: 0,
    ex: 'B is the largest tricuspid cusp, the anterior cusp. Trace the chordae: each papillary muscle sends chordae to the two cusps next to it (anterior papillary → anterior + posterior cusps).' },

  { t: 'c', id: 'A-C4', title: 'Left atrium and left ventricle: appendage, valves and the aortic sinuses', src: 'Anatomy p.19–20, 24–26',
    html: CVS.fig('anat-la', 'Base of the heart: the left atrium and the four pulmonary veins entering it.', 'anat', 24) +
      CVS.fig('anat-aortic', 'Aortic valve opened: semilunar cusps with nodule and lunula; coronary openings in the aortic sinuses.', 'anat', 26) },
  { t: 'q', id: 'A10', src: 'AC80 spot', keep: true,
    q: 'Station 6. Identify the chamber at the red arrow.',
    fig: CVS.fig('ac80s-st6b', 'AC80 spot station 6: 3D model of the heart, red arrow.', 'ac80s', 7),
    o: ['Left atrial appendage', 'Right atrial appendage', 'Right auricle', 'Left inferior pulmonary vein'], a: 0,
    ex: 'The narrow, finger-like pouch with a scalloped edge beside the pulmonary trunk is the left atrial appendage (left auricle). The right appendage is broad and triangular and wraps the root of the aorta.' },
  { t: 'tf', id: 'A11', src: 'Anatomy p.26', core: false,
    q: 'The coronary arteries open from the sinuses of Valsalva just above the aortic valve cusps, and the mitral valve is the only valve with two cusps.', a: true,
    ex: 'True. The aortic valve has three semilunar cusps (right, left, posterior); the coronary arteries arise from the aortic sinuses above them. The mitral (bicuspid) valve has an anterior and a posterior cusp.' },

  { t: 'c', id: 'A-C5', title: 'Coronary arteries: who supplies what, and dominance', src: 'Anatomy p.27–31, 64–65',
    html: CVS.fig('anat-coronary', 'Coronary arteries and the territory each supplies (take-home summary).', 'anat', 64) +
      CVS.fig('anat-dominance', 'Right-, left- and co-dominant hearts (cadaver specimens).', 'anat', 31) },
  { t: 'q', id: 'A12', src: 'AC79 · AC81', core: true,
    q: 'A patient is diagnosed with myocardial ischemia of the lateral wall of left ventricle. Which artery is most likely occluded?',
    o: ['Left circumflex artery', 'Anterior descending artery', 'Posterior interventricular artery', 'Diagonal artery', 'Conal artery'], a: 0,
    ex: 'The circumflex runs left in the coronary sulcus around the lateral and posterior border of the LV and gives the left marginal artery to the lateral wall. AC79 asked the same anatomy: “which artery circulates around the lateral and posterior border of the left ventricle?”.' },
  { t: 'q', id: 'A13', src: 'AC78 · AC80', core: true,
    q: 'What branch of the coronary artery supplies the AV node?',
    o: ['Right coronary artery', 'Left coronary artery', 'Anterior interventricular artery', 'Diagonal artery', 'Right marginal artery'], a: 0,
    ex: 'The AV nodal branch comes from the right coronary artery (about 80–90% of hearts, where the RCA is dominant). With no “AV nodal artery” option, RCA is the best answer.' },
  { t: 'q', id: 'A14', src: 'AC77',
    q: 'The artery supplying the SA node is branching from which artery?',
    o: ['Right coronary artery', 'Left coronary artery', 'Right marginal branch', 'Anterior interventricular artery', 'Posterior interventricular branch'], a: 0,
    ex: 'The sinuatrial nodal branch is the first branch of the RCA in most hearts (about 60%); it supplies the right atrium and SA node.' },
  { t: 'q', id: 'A15', src: 'AC77',
    q: 'Which artery is not the branch of the left coronary artery?',
    o: ['Conal a.', 'Anterior descending a.', 'Diagonal a.', 'Circumflex a.', 'Septal a.'], a: 0,
    ex: 'The conal artery is an early branch of the RCA to the pulmonary conus (infundibulum). The LCA splits into the anterior descending artery (with diagonal and septal branches) and the circumflex.' },
  { t: 'q', id: 'A16', src: 'AC78',
    q: 'A 60-year-old patient developed chest pain due to inferior border infarction. Which of the following arteries is most likely occluded?',
    o: ['Right marginal artery', 'Anterior descending artery', 'Posterior descending artery', 'Left coronary artery', 'Left circumflex artery'], a: 0,
    ex: 'The inferior (acute) border of the heart is formed by the right ventricle, supplied by the right marginal branch of the RCA.',
    flag: 'The key reads “inferior border” as the anatomical border (right ventricle). If the stem meant the inferior (diaphragmatic) wall of the LV, the answer would be the posterior descending artery instead. Learn both.' },
  { t: 'q', id: 'A17', src: 'AC81 spot', core: true, keep: true,
    q: 'Station 3. Identify structure A.',
    fig: CVS.fig('ac81s-st3', 'AC81 spot station 3: anterior surface of the heart with a probe in the coronary sulcus.', 'ac81s', 4),
    o: ['Left coronary artery', 'Left anterior descending artery', 'Left circumflex artery', 'Anterior interventricular vein'], a: 2,
    ex: 'A runs to the left along the coronary sulcus under the left auricle and curves to the back: the left circumflex. The LAD runs straight down the anterior interventricular sulcus; the LCA trunk is only 1–2 cm long, hidden between the pulmonary trunk and left auricle.' },
  { t: 'q', id: 'A18', src: 'AC81 spot', keep: true,
    q: 'Station 3. Identify structure B.',
    fig: CVS.fig('ac81s-st3', 'AC81 spot station 3: anterior surface of the heart.', 'ac81s', 4), figRef: 'A17',
    o: ['Pulmonary trunk', 'Aorta', 'Right atrial appendage', 'Left atrial appendage'], a: 3,
    ex: 'B is long, narrow, finger-like and scalloped, lying beside the pulmonary trunk: the left atrial appendage, the commonest site of thrombus in atrial fibrillation.' },
  { t: 'q', id: 'A19', src: 'AC80 spot', keep: true,
    q: 'Station 5 (lateral view). Identify the red arrow.',
    fig: CVS.fig('ac80s-st5', 'AC80 spot station 5: heart in lateral view; red arrow at the top, yellow arrow on the front.', 'ac80s', 6),
    o: ['Left anterior descending artery', 'Left circumflex artery', 'Left coronary artery', 'Anterior interventricular vein'], a: 2,
    ex: 'The red arrow marks the short main trunk where it leaves the aorta, before it divides: the left coronary artery.' },
  { t: 'q', id: 'A20', src: 'AC80 spot', keep: true,
    q: 'Station 5 (lateral view). Identify the yellow arrow.',
    fig: CVS.fig('ac80s-st5', 'AC80 spot station 5: heart in lateral view.', 'ac80s', 6), figRef: 'A19',
    o: ['Left anterior descending artery', 'Left circumflex artery', 'Left coronary artery', 'Anterior interventricular vein'], a: 0,
    ex: 'The yellow arrow follows the vessel running down the front toward the apex in the anterior interventricular sulcus: the left anterior descending artery.' },

  { t: 'c', id: 'A-C6', title: 'Cardiac veins: each vein runs with an artery', src: 'Anatomy p.34–35',
    html: CVS.fig('anat-veins', 'Sternocostal surface of the heart: veins (blue) beside the arteries (red).', 'anat', 35) },
  { t: 'q', id: 'A21', src: 'AC81', core: true,
    q: 'Which vein is located in the anterior interventricular sulcus?',
    o: ['Great cardiac vein', 'Small cardiac vein', 'Middle cardiac vein', 'Anterior cardiac vein', 'Oblique vein of left atrium'], a: 0,
    ex: 'The great cardiac vein runs up the anterior interventricular sulcus with the LAD, then turns left in the coronary sulcus to become the coronary sinus.' },
  { t: 'q', id: 'A22', src: 'AC80',
    q: 'What vein lies in the posterior interventricular sulcus?',
    o: ['Middle cardiac vein', 'Great cardiac vein', 'Small cardiac vein', 'Oblique vein of LA', 'Coronary sinus'], a: 0,
    ex: 'The middle cardiac vein accompanies the posterior interventricular (descending) artery in the posterior sulcus and drains into the coronary sinus.' },
  { t: 'q', id: 'A23', src: 'AC78',
    q: 'Which vein lies within the coronary sulcus, parallel to the right coronary artery?',
    o: ['Small cardiac vein', 'Great cardiac vein', 'Middle cardiac vein', 'Anterior cardiac vein', 'Oblique cardiac vein'], a: 0,
    ex: 'The small cardiac vein runs in the right part of the coronary sulcus with the RCA and its marginal branch, then joins the coronary sinus.' },
  { t: 'q', id: 'A24', src: 'AC81 spot', core: true, keep: true,
    q: 'Station 4 (posterior surface). Identify structure A.',
    fig: CVS.fig('ac81s-st4', 'AC81 spot station 4: posterior surface of the heart.', 'ac81s', 5),
    o: ['Right coronary artery', 'Great cardiac vein', 'Coronary sulcus', 'Coronary sinus'], a: 3,
    ex: 'A is the wide vein lying in the posterior coronary sulcus between the left atrium and left ventricle: the coronary sinus. It collects the great, middle and small cardiac veins and opens into the right atrium beside the IVC opening.' },
  { t: 'q', id: 'A25', src: 'AC81 spot', keep: true,
    q: 'Station 4 (posterior surface). Identify B.',
    fig: CVS.fig('ac81s-st4', 'AC81 spot station 4: posterior surface of the heart.', 'ac81s', 5), figRef: 'A24',
    o: ['Anterior interventricular artery', 'Great cardiac vein', 'Posterior interventricular artery', 'Middle cardiac vein'], a: 2,
    ex: 'B runs in the posterior interventricular sulcus and is thick-walled and round: the posterior interventricular artery (from the RCA in a right-dominant heart). The middle cardiac vein shares the sulcus but is thin-walled and flattened.',
    flag: 'The paper says “Identify chamber B”, but B is a vessel; the stem was probably mistyped.' },

  { t: 'c', id: 'A-C7', title: 'Conduction system and nerves of the heart', src: 'Anatomy p.36–38, 65',
    html: CVS.fig('anat-conduction', 'Conduction pathway from the atria to the papillary muscles.', 'anat', 36) +
      CVS.fig('anat-condsupply', 'Arterial supply of the conduction system.', 'anat', 65) },
  { t: 'q', id: 'A26', src: 'AC80', core: true,
    q: 'Which structure lies between crista terminalis and superior vena cava?',
    o: ['SA node', 'AV node', 'Thebasian valve', 'Septomarginal band', 'AV bundle'], a: 0,
    ex: 'The SA node is specialized myocardium at the upper end of the crista terminalis where the SVC joins the right atrium. It starts each beat (atrial systole).' },
  { t: 'tf', id: 'A27', src: 'Anatomy p.37–38',
    q: 'Cardiac pain fibres travel with the sympathetic cardiac branches to spinal cord segments T1–T4, so ischemic pain is felt in the chest and the inner left arm.', a: true,
    ex: 'True. Visceral pain afferents run back with the sympathetic cardiac nerves to T1–T4; the same segments supply the chest wall and the medial arm, so pain is referred there. The vagus slows the heart; the sympathetic trunk speeds it.' },

  { t: 'c', id: 'A-C8', title: 'Great vessels: brachiocephalic veins, the arch and its branches', src: 'Anatomy p.49–56',
    html: CVS.fig('anat-archnetter', 'Arch of the aorta, its branches and the great veins.', 'anat', 50) +
      CVS.fig('anat-ligart', 'Cadaver: the band under the aortic arch and the nerve hooking around it.', 'anat', 52) },
  { t: 'q', id: 'A28', src: 'AC75',
    q: 'อะไรรวมเป็น brachiocephalic vein <span class="muted">(Which two veins join to form the brachiocephalic vein?)</span>',
    o: ['Internal jugular & subclavian vein', 'External jugular & subclavian vein', 'External jugular & azygos vein', 'Internal jugular & external jugular vein'], a: 0,
    ex: 'Each brachiocephalic (innominate) vein forms from the internal jugular and subclavian veins; the two brachiocephalic veins join to form the SVC in the superior mediastinum.' },
  { t: 'q', id: 'A29', src: 'AC81 spot', core: true, keep: true,
    q: 'Station 1. Which of the following is structure A in prenatal period?',
    fig: CVS.fig('ac81s-st1', 'AC81 spot station 1: aortic arch region.', 'ac81s', 2),
    o: ['Ligamentum arteriosum', 'Ductus arteriosus', 'Ligamentum venosum', 'Ductus venosus'], a: 1,
    ex: 'A is the short band under the arch at the start of the left pulmonary artery: the ligamentum arteriosum. The question asks for its name before birth, the ductus arteriosus. The ductus venosus and ligamentum venosum belong to the liver.' },
  { t: 'q', id: 'A30', src: 'AC81 spot', keep: true,
    q: 'Station 1. Identify structure B.',
    fig: CVS.fig('ac81s-st1', 'AC81 spot station 1: aortic arch region.', 'ac81s', 2), figRef: 'A29',
    o: ['Left vagus nerve', 'Recurrent laryngeal nerve', 'External branch of superior laryngeal nerve', 'Phrenic nerve'], a: 0,
    ex: 'B runs <b>down</b> across the left side of the arch: the left vagus. Its recurrent branch hooks under the arch behind the ligamentum arteriosum and climbs back up in the tracheoesophageal groove.' },
  { t: 'q', id: 'A31', src: 'AC80 spot', keep: true,
    q: 'Station 4. Identify structure A.',
    fig: CVS.fig('ac80s-st4', 'AC80 spot station 4: under the aortic arch; red arrow on a nerve.', 'ac80s', 5),

  { t: 'q', id: 'A32', src: 'AC80 spot', keep: true,
    q: 'Station 4. Identify the red arrow.',

    o: ['Recurrent laryngeal nerve', 'Lt. vagus nerve', 'Thoracic duct', 'Internal branch of superior laryngeal nerve'], a: 0,
    ex: 'The nerve hooking under the arch beside the ligamentum arteriosum and turning upward is the left recurrent laryngeal nerve. An arch aneurysm or a huge left atrium can stretch it → hoarseness.' },

  { t: 'c', id: 'A-C9', title: 'Fetal circulation: three shunts and what they leave behind', src: 'Anatomy p.57–58',
    html: CVS.fig('anat-fetal', 'Fetal circulation: umbilical vein → ductus venosus → IVC → right atrium → foramen ovale or ductus arteriosus.', 'anat', 57) },
  { t: 'q', id: 'A33', src: 'AC77 · AC79 · AC81', core: true,
    q: 'What is the prenatal structure of ligamentum arteriosum?',
    o: ['Ductus arteriosus', 'Ductus venosus', 'Umbilical vein', 'Umbilical arteries', 'Foramen ovale'], a: 0,
    ex: 'The ductus arteriosus carries blood from the pulmonary trunk to the aorta before birth. After birth O₂ rises and prostaglandin E₂ falls, so it constricts and closes, leaving the ligamentum arteriosum.' },
  { t: 'q', id: 'A34', src: 'AC78 · AC80', core: true,

  { t: 'q', id: 'V3', src: 'AC78',
    q: 'A patient measures his own blood pressure at home and records 110/70. Another measurement at the hospital records 140/80. What is the difference of mean arterial blood pressure between the two measurements?',
    o: ['17 mmHg', '9 mmHg', '13 mmHg', '20 mmHg', '30 mmHg'], a: 0,
    ex: 'Home MAP = 70 + 40/3 ≈ 83; hospital MAP = 80 + 60/3 = 100 → difference ≈ 17 mmHg (white-coat effect).' },
  { t: 'q', id: 'V4', src: 'AC78',
    q: 'Which structure has the most systolic pressure?',
    o: ['Femoral artery', 'Aorta', 'Arteriole', 'Central vein', 'Pulmonary artery'], a: 0,
    ex: 'Moving away from the heart the pressure wave is amplified: distal arteries have a higher systolic pressure and wider pulse pressure, though a slightly lower mean pressure.' },
  { t: 'q', id: 'V5', src: 'AC76 · AC79', core: true,
    q: 'When performing an indirect blood pressure measurement using the auscultatory method with a sphygmomanometer and stethoscope, which of the following events accurately indicates the systolic blood pressure?',
    o: ['The pressure reading when the Korotkoff sounds first become audible', 'The point at which the Korotkoff sounds completely disappear', 'The pressure at which the Korotkoff sounds become muffled', 'The reading obtained during the patient’s inspiration', 'The average of the highest and lowest audible Korotkoff sound pressures'], a: 0,
    ex: 'As the cuff deflates below systolic pressure, turbulent spurts start: Korotkoff phase 1 (first tapping) = systolic. Disappearance (phase 5) = diastolic. AC76 asked the same: “1st Korotkoff sound”.' },

  { t: 'c', id: 'V-C2', title: 'The pulse wave, arterial stiffness and abnormal pulses', src: 'Circ. dynamics 2 p.10–16',
    html: CVS.fig('cd2-stiffness', 'Pulse pressure along the arterial tree at different ages.', 'cd2', 12) +
      CVS.fig('cd2-pulses', 'Abnormal pulse waves: collapsing and plateau pulses.', 'cd2', 16) },
  { t: 'q', id: 'V6', src: 'AC77 · AC79 · AC80', core: true,
    q: 'A 60-year-old patient has severe arterial stiffness. What can be found upon examination?',
    o: ['Widened pulse pressure', 'Pulsus parvus et tardus', 'Decreased pulse velocity', 'Pulsus paradoxus'], a: 0,
    ex: 'A stiff aorta can’t store the stroke volume: systolic rises, diastolic falls → pulse pressure widens, and the pulse wave travels faster. AC77 (atherosclerosis) and AC79 (elderly arterial stiffness) keyed the same answer.' },
  { t: 'q', id: 'V7', src: 'AC76 · AC77', core: true,
    q: 'Which of the following can be observed in aortic regurgitation?',
    o: ['Collapsing pulse', 'Plateau pulse', 'Pulsus paradoxus', 'Weak pulse', 'Pulse deficit'], a: 0,
    ex: 'In AR a large stroke volume is ejected and then runs back into the LV: a sharp rise and a rapid fall = collapsing (water-hammer, Corrigan) pulse. Plateau pulse = aortic stenosis; pulsus paradoxus = tamponade. AC77 gave “diastolic murmur at the 2nd ICS parasternal” → collapsing pulse.' },
  { t: 'q', id: 'V8', src: 'AC78',
    q: 'An elderly patient presents with a widened pulse pressure. What is the most likely cause?',
    o: ['Aortic regurgitation', 'Atherosclerosis', 'Heart failure', 'Hypertension', 'Mitral valve stenosis'], a: 0,
    ex: 'Aortic regurgitation widens pulse pressure: big stroke volume (high SBP) plus diastolic run-off (low DBP). Heart failure and mitral stenosis narrow it.',
    flag: 'Arterial stiffness from atherosclerosis also widens pulse pressure in the elderly (V6). The key picked AR as the classic cause; if the stem gives a diastolic murmur, AR is certain.' },
  { t: 'q', id: 'V9', src: 'AC78',
    q: 'Which of the following is a classic sign of cardiac tamponade?',
    o: ['Pulsus paradoxus', 'Increased stroke volume', 'Left-sided heart failure', 'Widened pulse pressure', 'Bradycardia'], a: 0,
    ex: 'Pulsus paradoxus: pulse volume is large in expiration and small in inspiration (a fall of more than ~10 mmHg). In tamponade, inspiration fills the RV, which pushes the septum left in the stiff sac and cuts LV filling.' },

  { t: 'c', id: 'V-C3', title: 'Venous pressure and the pumps that bring blood back', src: 'Circ. dynamics 2 p.24–36',
    html: CVS.fig('cd2-musclepump', 'Standing vs walking: venous pressure in the feet falls with each step.', 'cd2', 30) },
  { t: 'q', id: 'V10', src: 'AC79 · AC81', core: true,
    q: 'What is the effect of inspiration on venous return and what is the reason behind it?',
    o: ['Decreased intrathoracic pressure leads to increased venous return', 'Increased intrathoracic pressure leads to decreased venous return', 'Decreased abdominal pressure leads to increased venous return', 'Increased abdominal pressure leads to increased venous return'], a: 0,
    ex: 'Thoracic pump: inspiration makes intrathoracic pressure more negative, so the intrathoracic veins and right atrium expand and draw blood in (abdominal pressure actually rises as the diaphragm descends). AC79: deep inspiration is the most effective way to raise venous return acutely.',
    flag: 'Only four options were recalled in AC81.' },
  { t: 'q', id: 'V11', src: 'AC75',
    q: 'Which of the following increases venous return?',
    o: ['Increased intravascular volume', 'Increased arteriolar resistance', 'Increased CVP', 'Increased peripheral dilatation / venous pooling', 'Decreased sympathetic tone'], a: 0,
    ex: 'More blood volume raises the pressure in the venous reservoir that pushes blood back to the heart. Raised CVP (right atrial pressure), venous pooling and lower venous tone all reduce return; higher arteriolar resistance reduces flow into the veins.' },
  { t: 'q', id: 'V12', src: 'AC78',
    q: 'Which would directly (without compensation) result in a decrease in CVP?',
    o: ['Increased venodilation', 'Increased cardiac vagal tone', 'Increased blood volume', 'Decreased TPR', 'Exhalation in normal breathing'], a: 0,
    ex: 'Venodilation pools blood in the compliant veins → less volume reaches the central veins → CVP falls. A slower heart (vagal tone) and a larger blood volume raise CVP; arteriolar dilation also raises it (handout p.36).' },

  { t: 'c', id: 'V-C4', title: 'Jugular venous pulse: a, c, x, v, y', src: 'Circ. dynamics 2 p.36–37',
    html: CVS.fig('cd2-jvp', 'Jugular venous pulse waveform.', 'cd2', 37) },
  { t: 'q', id: 'V13', src: 'AC80 · AC81', core: true,
    q: 'A patient has been diagnosed with atrial fibrillation. Which wave on the jugular venous pulse waveform should be absent?',
    o: ['a', 'c', 'x', 'v', 'y'], a: 0, keep: true,
    ex: 'The a wave is right atrial contraction. In AF the atria only quiver, so there is no a wave. AC81 asked the reverse: absent a wave → atrial fibrillation.' },
  { t: 'q', id: 'V14', src: 'AC76 · AC79', core: true,
    q: 'The “A” wave of venous pulsation in the neck correlates with which of the following events?',
    o: ['Atrial systole', 'Ventricular systole', 'Atrial relaxation', 'Atrial filling', 'Tricuspid valve closure'], a: 0,
    ex: 'a = atrial contraction · c = tricuspid valve bulging back as the ventricle contracts · x = atrial relaxation · v = venous filling of the atrium · y = atrium emptying into the RV after the tricuspid opens.' },
  { t: 'q', id: 'V15', src: 'AC76',
    q: 'A 56-year-old man with right heart failure has swollen feet and ankles. There is a pansystolic murmur that increases with inspiration, loudest at the left lower sternal border. Which abnormality would be expected on his jugular venous waveform?',
    o: ['Elevated v wave', 'Exaggerated x wave', 'Cannon a wave', 'Absent a wave', 'Elevated a wave'], a: 0,
    ex: 'Pansystolic murmur at the lower left sternal edge that gets louder on inspiration = tricuspid regurgitation. Blood leaks back into the RA during systole, so the v wave (atrial filling) becomes large.' }
]});

/* Section M: Microcirculation (116-69 handout 06, 36 pp.). Card text lives in data/lite.js. */
CVS.add({ id: 'M', short: 'Microcirculation', title: 'Microcirculation: Capillary Exchange, Starling Forces, Lymph & Edema', kind: 'Lecture',
  blurb: 'Capillary types and permeability, how gases, water and proteins cross the wall, Starling forces and net filtration (interactive calculator), lymph flow and the four ways to make edema.',
  items: [
  { t: 'c', id: 'M-C1', title: 'Capillary types and how leaky each one is', src: 'Microcirculation p.3–9, 14',
    html: CVS.fig('micro-components', 'Components of the microcirculation: arteriole, metarteriole, precapillary sphincters, capillaries, venule.', 'micro', 3) +
      CVS.fig('micro-types', 'Continuous, fenestrated and discontinuous capillaries, from tight to leaky.', 'micro', 8) },
  { t: 'q', id: 'M1', src: 'AC75', core: true,
    q: 'Which organ has the capillaries with smallest permeability of plasma membrane?',
    o: ['Brain', 'Lung', 'Kidney (glomeruli)', 'Muscle', 'Intestinal'], a: 0,
    ex: 'Brain capillaries are continuous with tight junctions sealing the clefts (blood–brain barrier), so they are the least permeable. Glomeruli and gut have fenestrated capillaries.' },
  { t: 'q', id: 'M2', src: 'AC76',
    q: 'Fenestrated capillary can be found in which of the following structures?',
    o: ['Pituitary gland', 'Liver', 'Brain', 'Parotid gland', 'Cerebrum'], a: 0,
    ex: 'Fenestrated capillaries surround epithelia that secrete or absorb: endocrine glands (pituitary), intestinal mucosa, choroid plexus, glomeruli. The liver has discontinuous sinusoids; brain capillaries are continuous; an exocrine gland like the parotid has continuous capillaries.' },
  { t: 'q', id: 'M3', src: 'AC76',
    q: 'Capillary at which of the following sites has the highest permeability to plasma molecules?',
    o: ['Liver', 'Kidney'], a: 0,
    ex: 'Liver sinusoids are discontinuous: wide gaps and an incomplete basement membrane let even plasma proteins through. The glomerulus is fenestrated but holds back albumin.',
    flag: 'Only two options were recalled.' },
  { t: 'q', id: 'M4', src: 'AC76',
    q: 'What happens when precapillary sphincter closes?',
    o: ['Decreased interstitial fluid volume', 'Increased capillary blood flow', 'Increased arteriole resistance'], a: 0,
    ex: 'With the sphincter shut, blood bypasses that capillary bed, capillary hydrostatic pressure there falls, filtration drops and absorption wins → less interstitial fluid.',
    flag: 'Only three options were recalled.' },

  { t: 'c', id: 'M-C2', title: 'Crossing the capillary wall: three routes', src: 'Microcirculation p.10–16',
    html: CVS.fig('micro-pathways', 'Routes across the capillary wall (after Renkin, 1977).', 'micro', 12) },
  { t: 'q', id: 'M5', src: 'AC78', core: true,
    q: 'How is NO transported from systemic circulation to the cerebrospinal fluid system?',
    o: ['Transcellular simple diffusion', 'Facilitated diffusion', 'Simple diffusion through fenestration', 'Vesicular transport', 'Convection through intercellular cleft'], a: 0,
    ex: 'NO, like O₂ and CO₂, is a small lipid-soluble gas: it diffuses straight through the endothelial cells, so even the tight blood–brain barrier does not stop it.' },
  { t: 'q', id: 'M6', src: 'AC79',
    q: 'Which of the following best describes the primary mechanism by which oxygen directly enters the cytoplasm of most body cells from the extracellular fluid?',
    o: ['Transcellular diffusion down its partial pressure gradient', 'Active transport via specific membrane pumps', 'Facilitated diffusion involving specific carrier proteins', 'Endocytosis through pinocytosis or phagocytosis', 'Paracellular transport through intercellular junctions'], a: 0,
    ex: 'O₂ is lipid-soluble and needs no carrier: it diffuses through the lipid membrane down its partial-pressure gradient (Fick’s law: gradient, area, thickness, diffusion coefficient).' },

  { t: 'c', id: 'M-C3', title: 'Starling forces and net filtration', src: 'Microcirculation p.17–25',
    html: CVS.fig('micro-starling', 'Starling forces at the arteriolar and venular ends of a capillary.', 'micro', 24) +
      CVS.fig('micro-pv', 'A rise in venous pressure raises capillary pressure more than the same rise in arterial pressure.', 'micro', 19) },
  { t: 'q', id: 'M7', src: 'AC81', core: true,
    q: 'The differences of Starling forces between a healthy man and a patient are shown in the table below. What can best explain this phenomenon?<table class="tbl compact"><tr><th>Starling force</th><th>Normal (mmHg)</th><th>Abnormal (mmHg)</th></tr><tr><td>Capillary hydrostatic pressure</td><td>30</td><td>30</td></tr><tr><td>Interstitial hydrostatic pressure</td><td>0</td><td>2</td></tr><tr><td>Capillary oncotic pressure</td><td>25</td><td>20</td></tr><tr><td>Interstitial oncotic pressure</td><td>5</td><td>15</td></tr></table>',
    o: ['Increase capillary filtration rate', 'No significant change', 'Absorption', 'Absorption net flow due to low hydrostatic pressure', 'No increase interstitial volume'], a: 0,
    ex: 'NFP = (Pc − Pi) − (πc − πi). Normal: (30 − 0) − (25 − 5) = +10. Patient: (30 − 2) − (20 − 15) = +23 → filtration more than doubles (low plasma protein and protein leaking into the interstitium). Try both in the calculator below.' },
  { t: 'q', id: 'M8', src: 'AC78', core: true,
    q: 'What is the net filtration pressure (NFP) in this patient? Pc = 33 mmHg, Pi = 3 mmHg, πc = 20 mmHg, πi = 2 mmHg, Kf = 1.',
    o: ['12 mmHg', '30 mmHg', '20 mmHg', '16 mmHg', '14 mmHg'], a: 0,
    ex: 'NFP = (33 − 3) − (20 − 2) = 30 − 18 = +12 mmHg (filtration).' },
  { t: 'q', id: 'M9', src: 'AC79',
    q: 'At the arterial end of a systemic capillary, which of the following Starling forces primarily promotes the net movement of fluid from the intravascular space into the interstitial fluid?',
    o: ['Capillary hydrostatic pressure', 'Plasma oncotic pressure', 'Interstitial fluid hydrostatic pressure', 'Systemic arterial pressure', 'Venous pressure'], a: 0,
    ex: 'At the arteriolar end Pc (~35 mmHg) exceeds the net oncotic pull, so fluid filters out. Plasma oncotic pressure and a positive interstitial pressure oppose filtration.' },
  { t: 'q', id: 'M10', src: 'AC78',
    q: 'Which force promotes fluid movement into the post-capillary venule?',
    o: ['Capillary oncotic pressure', 'Capillary hydrostatic pressure', 'Interstitial hydrostatic pressure', 'Interstitial oncotic pressure', 'Lymphatic drainage pressure'], a: 0,
    ex: 'At the venular end Pc has fallen (~15 mmHg) while plasma oncotic pressure (~28 mmHg) is unchanged, so the oncotic pull wins and fluid is absorbed.',
    flag: 'Interstitial hydrostatic pressure also pushes inward when it is positive, but it is normally slightly negative.' },
  { t: 'q', id: 'M11', src: 'AC80',
    q: 'Which microcirculation parameter most likely increases filtration?',
    o: ['Post-capillary vein constriction', 'Increased arteriole resistance', 'Plasma oncotic pressure', 'Impaired lymphatic drainage', 'Interstitial gel accumulation'], a: 0,
    ex: 'Constricting the outflow (venules) dams blood back into the capillaries → Pc ↑ → filtration ↑. A rise in venous pressure raises Pc more than the same rise in arterial pressure. Higher arteriolar resistance lowers Pc.' },
  { t: 'q', id: 'M12', src: 'AC79',
    q: 'Which of the following physiological events or conditions would lead to a decrease in the net movement (loss) of fluid from the capillaries into the interstitial space in the lower extremities?',
    o: ['Active leg exercise', 'Lymphatic vessel obstruction', 'Arteriolar dilation in the affected limb', 'Sustained standing without movement', 'Severe hypoproteinemia'], a: 0,
    ex: 'Walking works the muscle pump: venous pressure in the legs falls, so capillary pressure and filtration fall (and lymph flow rises). Standing still, arteriolar dilation and low albumin all increase net filtration.' },

  { t: 'c', id: 'M-C4', title: 'Lymph flow and the four ways to make edema', src: 'Microcirculation p.25–34',
    html: CVS.fig('micro-lymph', 'Lymph flow rises steeply as interstitial pressure rises.', 'micro', 28) },
  { t: 'q', id: 'M13', src: 'AC81', core: true,
    q: 'A patient undergoes mastectomy along with axillary lymph node removal and develops non-pitting edema due to lymphatic drainage impairment. Which of the following plays a major role in edema development?',
    o: ['Increased interstitial oncotic pressure', 'Increased interstitial hydrostatic pressure', 'Decreased capillary hydrostatic pressure', 'Increased capillary hydrostatic pressure'], a: 0,
    ex: 'Lymph normally carries filtered protein back to the blood. Without it protein accumulates in the interstitium → πi ↑ → more fluid is pulled out and kept there (protein-rich, non-pitting lymphedema).',
    flag: 'Only four options were recalled.' },
  { t: 'q', id: 'M14', src: 'AC80', core: true,
    q: 'A young girl is stung by a bee and develops localized edema with swelling, redness and pain at the site of the sting. Which of the following mechanisms is the primary cause of these symptoms?',
    o: ['Increased capillary permeability', 'Increased water and sodium retention', 'Increased capillary hydrostatic pressure', 'Increased arteriolar constriction', 'Increased capillary osmotic pressure'], a: 0,
    ex: 'Venom and histamine make the postcapillary venule endothelium leaky: protein escapes, the oncotic gradient collapses and fluid follows → local edema (with arteriolar dilation causing redness).' },
  { t: 'q', id: 'M15', src: 'AC77',
    q: 'What is the most likely mechanism which causes ascites in the patient with malnutrition?',
    o: ['Decreased capillary oncotic pressure', 'Decreased lymphatic drainage', 'Increased capillary hydrostatic pressure', 'Increased mucopolysaccharides in interstitial fluid', 'Increased vascular permeability'], a: 0,
    ex: 'Too little protein intake → low plasma albumin → πc ↓ → less fluid is held in the capillaries (kwashiorkor). Same idea as cirrhosis (less albumin made) and nephrosis (albumin lost).' },
  { t: 'q', id: 'M16', src: 'AC79',
    q: 'A patient presents with significant bilateral pitting edema in the lower extremities. Assuming the patient has normal venous and lymphatic function, which of the following systemic conditions is the most likely primary cause of this edema?',
    o: ['Loss of plasma albumin', 'Increased capillary hydrostatic pressure due to localized venous obstruction', 'Decreased interstitial fluid osmotic pressure', 'Increased lymphatic drainage', 'Excessive production of antidiuretic hormone (ADH)'], a: 0,
    ex: 'Bilateral, systemic, with normal veins and lymphatics → low plasma oncotic pressure from albumin loss (e.g. nephrotic syndrome). A local venous block would be one-sided.' },
  { t: 'q', id: 'M17', src: 'AC80',
    q: 'A decrease in which of the following tends to increase edema?',
    o: ['Plasma colloid osmotic pressure', 'Interstitial hydrostatic pressure', 'Capillary hydrostatic pressure', 'Arteriolar dimension'], a: [0, 1],
    ex: 'Lower plasma oncotic pressure weakens the inward pull, and a lower (more negative) interstitial pressure pulls more fluid out: both favour filtration. Lower capillary pressure or a narrower arteriole reduce filtration.',
    flag: 'The AC80 key accepts both A and B.' }
]});

/* Section R: Regulation in the Cardiovascular System (116-69 handout 07, 67 pp.). Card text lives in data/lite.js. */
CVS.add({ id: 'R', short: 'Regulation', title: 'Regulation of the Cardiovascular System', kind: 'Lecture',
  blurb: 'Control centres and the autonomic nerves, the baroreceptor reflex (interactive map), chemoreceptor and CNS ischemic responses, the short-, medium- and long-term control of blood pressure (RAAS, ADH, kidney), and local control of blood flow.',
  items: [
  { t: 'c', id: 'R-C1', title: 'Control centres and what each autonomic arm does to the heart', src: 'Regulation p.4–7, 14–22',
    html: CVS.fig('reg-ans', 'Sympathetic (left) and vagal (right) effects on the pacemaker potential.', 'reg', '20, 22') },
  { t: 'q', id: 'R1', src: 'AC80', core: true,
    q: 'A sympathomimetic drug is prescribed to a patient. What is the effect of this drug to the patient?',
    o: ['This drug can bind to beta 1 receptor', 'Increase parasympathetic activity', 'Cause peripheral vasodilation', 'Decrease heart contractility'], a: 0,
    ex: 'A sympathomimetic mimics noradrenaline/adrenaline, so it acts on adrenergic receptors including cardiac β1 (HR, conduction and contractility ↑) and vascular α1 (vasoconstriction).' },
  { t: 'q', id: 'R2', src: 'AC80',
    q: 'A man suffers from congestive heart failure due to myocardial infarction. He is given a sympathomimetic drug that increases heart rate and left ventricular ejection fraction (LVEF). What is the mechanism that leads to the increase in LVEF?',
    o: ['Increase intracellular Ca²⁺', 'Increase of preload', 'Increase of afterload', 'Increased permeability of funny channels', 'Decreased permeability of L-type calcium channels'], a: 0,
    ex: 'β1 → cAMP → PKA phosphorylates L-type Ca²⁺ channels and phospholamban → more Ca²⁺ enters and more is stored and released by the SR → stronger contraction → ESV falls and EF rises. Funny channels explain the HR, not the EF.' },

  { t: 'c', id: 'R-C2', title: 'The baroreceptor reflex: the beat-to-beat pressure controller', src: 'Regulation p.8–10, 23, 33–34, 64–65',
    html: CVS.fig('reg-baro', 'Baroreceptor reflex arc: carotid sinus and aortic arch → medulla → vagus and sympathetic nerves.', 'reg', 10) },
  { t: 'q', id: 'R3', src: 'AC81', core: true,
    q: 'A 35-year-old man presents with acute watery diarrhea for 2 days. Vital signs: BP 100/50 mmHg, HR 100 bpm (baseline 120/70 mmHg, 65 bpm). Which of the following mechanisms is employed to maintain arterial pressure?',
    o: ['Increased heart rate from decreased baroreceptor stimulation', 'Angiotensinogen mediated vasoconstriction', 'Increased free water reabsorption from aldosterone', 'Decreased sodium excretion from antidiuretic hormone'], a: 0,
    ex: 'Lower pressure stretches the carotid sinus and aortic arch less → fewer afferent impulses → vagal tone falls and sympathetic tone rises → HR 100. The distractors mix up the hormones: angiotensin II (not angiotensinogen) constricts, aldosterone retains Na⁺, ADH retains water.',
    flag: 'Only four options were recalled.' },
  { t: 'q', id: 'R4', src: 'AC79', core: true,
    q: 'A 35-year-old man has acute watery diarrhea for 2 hours due to laxative overuse. BP 90/50 mmHg, HR 120 bpm (baseline 120/70, 80 bpm). Which of the following mechanisms does NOT occur in response to the BP change in this patient?',
    o: ['Increased afferent signals through the glossopharyngeal nerve to the nucleus tractus solitarius', 'Increased cardiac contractility by activating β1 adrenergic receptors', 'Activation of vasomotor center', 'Increased sympathetic signals to the ventricles', 'Decreased parasympathetic signals to the sinoatrial node'], a: 0,
    ex: 'When BP falls, the carotid sinus fires <b>less</b>, so afferent traffic in the Hering nerve (CN IX) to the NTS decreases. Everything else listed is the correct compensation.' },
  { t: 'q', id: 'R5', src: 'AC75',
    q: 'An increase in which of the following results in a decrease in sympathetic vasoconstrictor tone?',
    o: ['Aortic arch stretch receptor', 'Carotid body chemoreceptor', 'Medullary chemoreceptor', 'Vasomotor center', 'Pain receptor'], a: 0,
    ex: 'More stretch of the arch baroreceptors signals high pressure → the NTS inhibits the vasomotor centre → sympathetic vasoconstrictor tone falls. Chemoreceptors, pain and the vasomotor centre all raise it.',
    flag: 'AC75 asked this twice, once as “decreased sympathetic vasodilator tone”; the key was the same.' },
  { t: 'q', id: 'R6', src: 'AC77',
    q: 'Which is the finding correlated to changing position from supine to upright?',
    o: ['Accumulation of blood in the lower extremities', 'Bradycardia', 'Dilatation of the external iliac artery', 'Increased stimulation of baroreceptors', 'Increased venous return'], a: 0,
    ex: 'Standing pools about half a litre in the leg veins → venous return, SV and MAP fall → baroreceptors fire less → HR and vasoconstriction rise to restore pressure.' },
  { t: 'q', id: 'R7', src: 'AC77',
    q: 'Which of the following would happen after blood pressure falls?',
    o: ['Increased sympathetic action', 'Stimulate aortic sinus', 'Inhibit central chemoreceptor', 'Increased peripheral perfusion pressure', 'Decreased peripheral resistance'], a: 0,
    ex: 'Less baroreceptor firing → sympathetic outflow ↑ (HR, contractility, arteriolar and venous constriction) → TPR rises. The baroreceptors are stimulated less, not more.' },

  { t: 'c', id: 'R-C3', title: 'Chemoreceptors, the CNS ischemic response and other reflexes', src: 'Regulation p.11–12, 25–27, 35–37',
    html: CVS.fig('reg-chemo', 'Chemoreceptor reflex: peripheral bodies and central chemoreceptors → NTS → heart, vessels and breathing.', 'reg', 25) },
  { t: 'q', id: 'R8', src: 'AC77', core: true,
    q: 'Which clinical finding is the most likely to be found in CNS ischemic reflex?',
    o: ['Systemic hypertension', 'Decreased pulse pressure', 'Increased diastolic pressure', 'Tachycardia'], a: 0,
    ex: 'When brain blood flow falls, CO₂ and H⁺ build up at the vasomotor centre → the most powerful sympathetic vasoconstriction of all → arterial pressure rises sharply. In the Cushing reaction (raised intracranial pressure) the baroreceptors then slow the heart: hypertension with wide pulse pressure, bradycardia and irregular breathing.' },
  { t: 'q', id: 'R9', src: 'AC77',
    q: 'Which of the following isn’t one of the chemoreceptor reflex components?',
    o: ['Adrenal cortex', 'Nucleus tractus solitarius', 'Hering nerve', 'Aortic nerve', 'Cerebellum'], a: 0,
    ex: 'Peripheral chemoreceptor arc: carotid bodies (Hering nerve, CN IX) and aortic bodies (aortic nerve, CN X) → NTS → cardiovascular and respiratory centres → autonomic nerves (and the adrenal medulla). The adrenal cortex is not part of it.',
    flag: 'The cerebellum is not part of the arc either; the paper spelled “nucleus tactile solitarius”. Keyed answer: adrenal cortex.' },

  { t: 'c', id: 'R-C4', title: 'Seconds, hours, days: RAAS, ADH and the kidney', src: 'Regulation p.31–48, 64',
    html: CVS.fig('reg-timeline', 'How fast and how strongly each pressure control works after a sudden change in pressure.', 'reg', 32) +
      CVS.fig('reg-raas', 'The renin–angiotensin system and its targets (lecture diagram).', 'reg', 42) },
  { t: 'q', id: 'R10', src: 'AC81', core: true,
    q: 'A patient with hypertension is prescribed enalapril, an angiotensin converting enzyme inhibitor. What is the most likely mechanism of this drug?',
    o: ['Reduce aldosterone release', 'Increase renal filtration'], a: 0,
    ex: 'ACE (mostly in the lung) turns angiotensin I into angiotensin II. Less angiotensin II → less vasoconstriction, less aldosterone (less Na⁺ and water retention), less ADH and thirst → BP falls.',
    flag: 'Only two options were recalled.' },
  { t: 'q', id: 'R11', src: 'AC80',
    q: 'A 35-year-old man presents with acute watery diarrhea for the past 5 days. Which of the following mechanisms has the greatest effect?',
    o: ['Angiotensin II mediated vasoconstriction', 'Baroreceptor reflex', 'Capillary fluid shift', 'Chemoreceptor reflex', 'Salt water reabsorption by kidney'], a: 0,
    ex: 'After days the baroreflex has adapted (reset) and the renin–angiotensin system is fully active, so angiotensin II-mediated vasoconstriction carries much of the pressure support.',
    flag: 'Doubtful key. The time graph (p.32) shows renal volume control taking over after days, so “salt and water reabsorption by kidney” is also defensible. Learn the timeline: reflexes (seconds) → RAAS, stress relaxation, fluid shift (minutes–hours) → kidney, aldosterone, ADH (days).' },

/* Short concept cards: each card's body is written here as arrow chains and brief bullets.
   Loaded last (data/sections.json), so it rebuilds the html of every card listed below.
   The card's figures and flow widgets are taken from its original html in the section file;
   the text there is superseded. Block syntax (one string per block):
     '> A → B → C'      cause → effect chain          '- text'   bullet (consecutive bullets form one list)
     '## Heading'        small group label            '! text'   exam trap / past-paper note
     '| a | b |'         table row (first row = head)  '= text'   centered equation
     '@F1' '@F2'         place that figure here; figures not placed go to a column beside the text
     '@X1'               place that flow widget        {{...}}    cloze blank (keep 3–8 per card, key ideas only)
     '@flow:name'        an interactive chart from src/flows*.js
     '---'               what follows goes full width under the text and figure columns */
(function () {
  var C = window.CVS, byId = {};
  C.sections.forEach(function (s) { s.items.forEach(function (it) { byId[it.id] = it; }); });
  function inl(t) { return C.cloze(String(t)).replace(/(→|↔|⇄)/g, '<span class="lt-ar">$1</span>'); }
  function render(blocks, F, X) {
    var out = [], main = out, below = null, ul = null, tb = null, used = {};
    function flush() {
      if (ul) { out.push('<ul class="lt-pts">' + ul.join('') + '</ul>'); ul = null; }
      if (tb) {
        out.push('<div class="tblwrap"><table class="lt-tbl"><thead><tr>' + tb[0].map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
          tb.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inl(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>');
        tb = null;
      }
    }
    blocks.forEach(function (b) {
      b = b.replace(/<(?![A-Za-z\/!])/g, '&lt;');  /* a bare < (as in "< 80") is text, not a tag */
      var k = b.slice(0, 2), t = b.slice(2);
      if (k === '- ') { if (tb) flush(); (ul = ul || []).push('<li>' + inl(t) + '</li>'); return; }
      if (b[0] === '|') { if (ul) flush(); (tb = tb || []).push(b.replace(/^\|\s*|\s*\|\s*$/g, '').split(/\s*\|\s*/)); return; }
      flush();
      if (b === '---') { below = []; out = below; return; }
      if (k === '> ') out.push('<p class="lt-chain">' + inl(t) + '</p>');
      else if (b.slice(0, 3) === '## ') out.push('<h4 class="lt-h">' + b.slice(3) + '</h4>');
      else if (k === '! ') out.push('<p class="lt-trap">' + inl(t) + '</p>');
      else if (k === '= ') out.push('<div class="eqn">' + inl(t) + '</div>');
      else if (/^@F\d+$/.test(b)) { var i = +b.slice(2) - 1; if (!F[i]) throw new Error('no figure ' + b); used[i] = 1; out.push(F[i]); }
      else if (/^@flow:\w+$/.test(b)) out.push('<div class="flowx" data-flow="' + b.slice(6) + '"></div>');
      else if (/^@X\d+$/.test(b)) { var j = +b.slice(2) - 1; if (!X[j]) throw new Error('no flow ' + b); out.push(X[j]); }
      else out.push('<p class="lt-p">' + inl(b) + '</p>');
    });
    flush();
    var rest = F.filter(function (f, i) { return !used[i]; });
    var text = '<div class="lt">' + main.join('') + '</div>';
    var top = rest.length ? '<div class="two lt-two">' + text + '<div class="lt-figs">' + rest.join('') + '</div></div>' : text;
    return below ? '<div class="lt">' + top + below.join('') + '</div>' : top;
  }
  C.short = function (id, blocks, opt) {
    var it = byId[id];
    if (!it || it.t !== 'c') throw new Error('short(): no concept ' + id);
    var F = [], X = [];
    /* figures in document order; a collapsed <details> that holds a figure (answers, extra slides) is kept whole */
    String(it.html).replace(/<details\b[\s\S]*?<\/details>|<figure\b[\s\S]*?<\/figure>/g, function (m) { if (/^<figure/.test(m) || /<figure\b/.test(m)) F.push(m); return m; });
    String(it.html).replace(/<div class="flowx"[^>]*><\/div>/g, function (m) { X.push(m); return m; });
    if (opt && opt.drop) F = F.filter(function (f, i) { return opt.drop.indexOf(i + 1) < 0; });
    it.html = render(blocks, F, X);
  };
})();
var S_ = CVS.short;
